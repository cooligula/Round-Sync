name: Build fork (debug APKs)

# Fork-only workflow, kept separate from upstream's android.yml so that merging
# upstream changes does not conflict. Builds the OSS debug variant on GitHub,
# publishes the APKs as workflow artifacts, and attaches them to a GitHub
# release when a version tag (v*) is pushed.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: build-fork-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read versions from gradle.properties
        id: versions
        run: |
          echo "go=$(grep -E '^de\.felixnuesse\.extract\.goVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(grep -E '^de\.felixnuesse\.extract\.ndkVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
          echo "rclone=$(grep -E '^de\.felixnuesse\.extract\.rCloneVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;${{ steps.versions.outputs.ndk }}"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      # Compiling rclone for four ABIs is by far the slowest step; its Go
      # module/source cache only changes when the rclone/NDK/Go versions do.
      - name: Cache rclone build inputs
        uses: actions/cache@v4
        with:
          path: rclone/cache
          key: rclone-${{ steps.versions.outputs.rclone }}-go${{ steps.versions.outputs.go }}-ndk${{ steps.versions.outputs.ndk }}-${{ hashFiles('rclone/build.gradle') }}

      - name: Build OSS debug APKs
        run: ./gradlew assembleOssDebug --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: roundsync-oss-debug
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roundsync-oss-debug
          path: apks
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
          prerelease: true
