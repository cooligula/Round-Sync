name: Build fork (debug APKs)

# Fork-only workflow, kept separate from upstream's android.yml so that merging
# upstream changes does not conflict. Builds the OSS debug variant on GitHub,
# publishes the APKs as workflow artifacts, and attaches them to a GitHub
# release when a version tag (v*) is pushed.

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'feature/**'
    tags:
      - 'v*'
  pull_request:

concurrency:
  group: build-fork-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Read versions from gradle.properties
        id: versions
        run: |
          echo "go=$(grep -E '^de\.felixnuesse\.extract\.goVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
          echo "ndk=$(grep -E '^de\.felixnuesse\.extract\.ndkVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"
          echo "rclone=$(grep -E '^de\.felixnuesse\.extract\.rCloneVersion=' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.versions.outputs.go }}
          cache: false

      # The GitHub-hosted image already ships the Android SDK (ANDROID_HOME),
      # so no setup action is needed; just accept licenses and add the NDK.
      - name: Install NDK and SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;${{ steps.versions.outputs.ndk }}" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      # Compiling rclone for four ABIs is by far the slowest step; its Go
      # module/source cache only changes when the rclone/NDK/Go versions do.
      - name: Cache rclone build inputs
        uses: actions/cache@v4
        with:
          path: rclone/cache
          key: rclone-${{ steps.versions.outputs.rclone }}-go${{ steps.versions.outputs.go }}-ndk${{ steps.versions.outputs.ndk }}-${{ hashFiles('rclone/build.gradle') }}

      - name: Build OSS debug APKs
        run: ./gradlew assembleOssDebug --stacktrace

      # Non-blocking: surfaces lint errors as annotations on the run page.
      - name: Lint (errors as annotations)
        continue-on-error: true
        run: |
          ./gradlew :app:lintOssDebug -x :rclone:buildAll || true
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/reports/lint-results-*.xml'):
              for i in ET.parse(f).getroot().iter('issue'):
                  if i.get('severity') in ('Error', 'Fatal'):
                      loc = i.find('location')
                      path = loc.get('file', '') if loc is not None else ''
                      line = loc.get('line', '1') if loc is not None else '1'
                      msg = (i.get('id') + ': ' + i.get('message')).replace('\n', ' ')
                      print(f'::error file={path},line={line}::{msg}')
          PY

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: roundsync-oss-debug
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roundsync-oss-debug
          path: apks
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
          prerelease: true
